<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记账</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记账">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f5f4f0;--card:#ffffff;--ink:#1d1d1b;--muted:#8a8780;--line:#ebe9e4;
  --accent:#2f7d5b;--accent-soft:#e3f0e9;--amber:#b7791f;--amber-soft:#fbf1dd;--danger:#b42318;--danger-soft:#fbe7e4;
  --chip:#f1efea;--kb:0px;--bar:76px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe7;--muted:#8f8c85;--line:#2c2b28;
  --accent:#5fb98d;--accent-soft:#1f3329;--amber:#e0a84a;--amber-soft:#33281a;--danger:#f0786b;--danger-soft:#3a1e1b;--chip:#2a2926;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(var(--bar) + 40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);font-size:16px}

.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.month{display:flex;align-items:center;gap:6px}
.month b{font-size:17px;font-weight:600;min-width:104px;text-align:center}
.nav{width:34px;height:34px;border-radius:10px;font-size:20px;color:var(--muted)}
.nav:disabled{opacity:.3;cursor:default}
.nav:not(:disabled):active{background:var(--chip)}
.gear{font-size:14px;color:var(--muted);padding:6px 10px;border-radius:10px}
.gear:active{background:var(--chip)}

.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:12px;border:1px solid var(--line)}
.label{font-size:13px;color:var(--muted)}
.title{font-size:14px;font-weight:600;margin:0 0 12px}

.banner{border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:none}
.banner.show{display:block}
.banner.remind{background:var(--amber-soft);color:var(--amber)}
.banner.update{background:var(--accent);color:#fff;text-align:center;padding:0}
.banner.update button{display:block;width:100%;padding:11px 14px;color:#fff;font-weight:600;text-decoration:none;font-size:14px}
.banner.info{background:var(--chip);color:var(--muted);text-align:center}
.banner button{color:inherit;font-weight:600;text-decoration:underline;font-size:13px}

/* 概览 */
.big{font-size:42px;font-weight:650;letter-spacing:-.5px;line-height:1.15;margin:2px 0 4px}
.big.over{color:var(--danger)}
.big.num,.stat .v.num{font-variant-numeric:normal}
.spent{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:10px}
.spent b{font-size:24px;font-weight:600}
.spent span{font-size:20px;color:var(--muted)}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--chip);border-radius:12px;padding:10px 14px 12px;container-type:inline-size}
.stat .v{font-size:clamp(18px,18cqi,30px);font-weight:650;line-height:1.2;margin-top:2px;white-space:nowrap}
.stat .v.neg{color:var(--danger)}
.linkbtn{margin-top:12px;color:var(--accent);font-weight:600;font-size:14px}

/* 记账大框 */
.aibox{position:relative;margin:14px 0}
.aibox #aiClear{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--muted);font-size:15px;line-height:26px;display:none}
.amt .clr{flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--muted);font-size:15px;line-height:26px;margin-right:4px;display:none}
.amt.has .clr{display:block}
.aibox.has #aiClear{display:block}
.aibox textarea{padding-right:42px !important}
.entry textarea{margin:0;width:100%;min-height:48px;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;outline:0;display:block;line-height:1.4}
.entry textarea:focus{border-color:var(--accent)}
.entry textarea.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.entry .sep{height:1px;background:var(--line);margin:16px 0 12px}
.amt{display:flex;align-items:center;gap:6px;border-bottom:1.5px solid var(--line);padding-bottom:6px}
.amt.active{border-color:var(--accent)}
.amt .sym{font-size:24px;color:var(--muted);white-space:nowrap}
.amt input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:30px;font-weight:600;padding:2px 0}
.curpick{display:flex;gap:4px;flex:0 0 auto}
.curpick button{min-width:38px;height:32px;padding:0 8px;border-radius:9px;background:var(--chip);font-size:14px;color:var(--muted)}
.curpick button.on{background:var(--ink);color:var(--card)}
.curpick button.on.foreign{background:var(--amber);color:#fff}
.preview{font-size:13px;color:var(--muted);margin:8px 0 0}
.preview:empty{display:none}
.preview b{color:var(--ink);font-weight:600}
.preview .over{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:7px 14px;border-radius:99px;background:var(--chip);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:50%}
.chip.on{background:var(--ink);color:var(--card)}
.chip.add{color:var(--muted);padding:7px 13px}
.chip.edit{color:var(--muted)}
.chip.done{background:var(--accent);color:#fff}
.chip .x{margin-left:2px;color:var(--danger);font-weight:600}
.chipinput{width:96px;padding:6px 12px;border-radius:99px;border:1.5px solid var(--accent);background:var(--bg);outline:0;font-size:16px}
.row2{display:flex;gap:8px}
.field{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;outline:0}
.field:focus{border-color:var(--accent)}
.field.date{flex:0 0 auto;width:150px}
.field.date.notToday{border-color:var(--amber);color:var(--amber);font-weight:600}
.warn{font-size:13px;color:var(--amber);margin:10px 0 0;display:none;justify-content:space-between;align-items:center}
.warn.show{display:flex}
.warn button{color:var(--accent);font-weight:600;font-size:13px}

/* 固定在底部的按钮：处理和确认在同一个位置 */
.actionbar{position:fixed;left:0;right:0;bottom:var(--kb);z-index:30;padding:10px calc(16px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.actionbar .in{max-width:480px;margin:0 auto;display:flex;gap:10px}
.actionbar button{height:56px;border-radius:16px;font-weight:600;font-size:17px}
#mainBtn{flex:1;background:var(--accent);color:#fff}
#mainBtn:disabled{opacity:.5}
#mainBtn:not(:disabled):active{filter:brightness(.92)}
#cancelBtn{flex:0 0 30%;background:var(--card);border:1px solid var(--line);color:var(--muted);display:none}
body.confirming #cancelBtn{display:block}
body.settings-open .actionbar{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--kb) + var(--bar) + 8px + env(safe-area-inset-bottom));z-index:31;background:var(--ink);color:var(--card);font-size:13px;padding:7px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.toast.err{background:var(--danger);color:#fff}

/* 确认弹窗 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
body.confirming .dim{display:block}
.confirm{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:calc(var(--kb) + var(--bar));z-index:25;display:none;padding:16px;align-items:center;justify-content:center}
body.confirming .confirm{display:flex}
.confirm .in{width:100%;max-width:440px;margin:0 auto;background:var(--card);border-radius:20px;padding:18px 18px 16px;max-height:100%;box-shadow:0 8px 30px rgba(0,0,0,.15);display:flex;flex-direction:column}
.confirm .in.list{height:min(440px,100%)}
.confirm .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.confirm .head{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px;flex:0 0 auto}
.confirm .one{text-align:center;padding:8px 0 4px}
.confirm .one .a{font-size:44px;font-weight:650;line-height:1.15}
.confirm .one .eq{font-size:16px;color:var(--muted);margin-top:2px}
.confirm .one .row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.confirm .one .nt{font-size:16px;color:var(--muted);overflow-wrap:anywhere}
.confirm .item{align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.confirm .item:last-child{border-bottom:0}
.confirm .item .note{font-size:16px;white-space:normal;overflow:visible;overflow-wrap:anywhere;padding-top:3px}
.confirm .item .m{font-size:18px;padding-top:2px}
.confirm .item .m small{font-size:13px}
.confirm .item .del{margin-top:2px}
.confirm .after{font-size:16px;color:var(--ink);text-align:center;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);flex:0 0 auto}
.confirm .after b{font-weight:650}
.confirm .after .over{color:var(--danger);font-weight:600}
/* 类别下拉：外面是好看的小胶囊，里面盖着一个透明的系统下拉框 */
.catsel{position:relative;display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 11px;border-radius:99px;background:var(--chip);font-size:16px;white-space:nowrap;flex:0 0 auto}
.catsel i{width:8px;height:8px;border-radius:50%}
.catsel .caret{font-size:11px;color:var(--muted)}
.catsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;-webkit-appearance:none;appearance:none;cursor:pointer}

.cat{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;margin:9px 0}
.cat .n{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .track{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.cat .track i{display:block;height:100%;border-radius:99px}
.cat .a{font-size:13px;text-align:right;min-width:88px}
.cat .a em{font-style:normal;color:var(--muted);margin-left:4px}
#breakdown .cat:last-child{margin-bottom:0}
.split{height:1px;background:var(--line);margin:16px 0}

.day{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:12px 0 4px;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0;padding-top:0}
.item{display:flex;align-items:center;gap:10px;padding:9px 0}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.item .d{font-size:12px;color:var(--muted);white-space:nowrap}
.item .c{font-size:14px;white-space:nowrap}
#list .item{cursor:pointer}
.item .more{display:none;font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;flex:0 0 auto}
.item.trunc .more{display:inline}
.item.open .note{white-space:normal;overflow:visible;overflow-wrap:anywhere}
.item .note{font-size:13px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:15px;font-weight:600;text-align:right;white-space:nowrap}
.item .m small{display:block;font-size:12px;font-weight:400;color:var(--muted);line-height:1.2}
.del{font-size:13px;color:var(--muted);width:28px;height:28px;border-radius:8px;flex:0 0 auto}
.del.arm{width:auto;padding:0 10px;background:var(--danger-soft);color:var(--danger);font-weight:600}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0 6px}

/* 设置 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:40}
.mask.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h3{margin:0 0 16px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{font-size:14px;font-weight:400;color:var(--muted)}
.sheet h4{font-size:15px;margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.sheet .lbl{font-size:13px;color:var(--muted);margin:0 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.seg button{flex:1;min-width:80px;padding:9px;border-radius:12px;background:var(--chip)}
.seg button.on{background:var(--ink);color:var(--card)}
.primary{width:100%;background:var(--accent);color:#fff;border-radius:14px;padding:13px;font-weight:600;font-size:16px}
.ghost{width:100%;padding:12px;border-radius:14px;background:var(--chip);font-weight:500;margin-top:10px}
.sheet .field.full{width:100%;margin-bottom:18px}
.sheet .field.big2{font-size:18px}
.raterow{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.raterow .field{flex:0 0 96px;padding:8px 10px;text-align:right}
.raterow .field.bad{border-color:var(--danger)}
.raterow .to{flex:1}
.raterow button{width:28px;height:28px;border-radius:50%;color:var(--muted)}
select.field{width:100%;margin-bottom:6px;appearance:auto}
.catedit{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.catedit span{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:99px;background:var(--chip);font-size:14px}
.catedit span i{width:7px;height:7px;border-radius:50%}
.catedit span button{width:22px;height:22px;border-radius:50%;color:var(--muted);font-size:13px}
.addcat{display:flex;gap:8px;margin-bottom:6px}
.addcat button{padding:0 16px;border-radius:12px;background:var(--chip);font-weight:500}
.small{font-size:12px;color:var(--muted);margin:0 0 14px;min-height:18px}
.small.err{color:var(--danger)}
.small.ok{color:var(--accent)}
.two{display:flex;gap:8px}
.two .ghost{margin-top:0}
textarea.field{width:100%;min-height:70px;resize:vertical;font-size:13px;margin:10px 0 0}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="month">
      <button class="nav" id="prev" aria-label="上个月">‹</button>
      <b id="monthLabel"></b>
      <button class="nav" id="next" aria-label="下个月">›</button>
    </div>
    <button class="gear" id="openSettings">设置</button>
  </div>

  <div class="banner update" id="updateBar"><button id="updateBtn">有新版本，点这里更新</button></div>
  <div class="banner info" id="noteBar"></div>
  <div class="banner remind" id="remindBar"></div>
  <div class="banner remind" id="backupBar"></div>

  <section class="card" id="hero"></section>

  <section class="card entry">
    <div class="amt" id="amtRow">
      <span class="sym" id="curSym">$</span>
      <input id="amount" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="金额">
      <button class="clr" id="amtClear" aria-label="清空金额">×</button>
      <div class="curpick" id="curPick"></div>
    </div>
    <div class="preview" id="preview"></div>
    <div class="aibox"><textarea id="aiText" rows="2" maxlength="500"></textarea><button id="aiClear" aria-label="清空">×</button></div>
    <div class="chips" id="chips"></div>
    <div class="row2">
      <input class="field" id="note" placeholder="备注" maxlength="60">
      <input class="field date" id="date" type="date" aria-label="日期">
    </div>
    <div class="warn" id="curwarn"><span id="curwarnText"></span><button id="backMain"></button></div>
    <div class="warn" id="datewarn"><span id="datewarnText"></span><button id="backToday">改回今天</button></div>
  </section>

  <section class="card">
    <div id="breakPart" style="display:none">
      <p class="title">钱花在了哪</p>
      <div id="breakdown"></div>
      <div class="split"></div>
    </div>
    <p class="title">明细</p>
    <div id="list"></div>
  </section>
</div>

<div class="dim" id="dim"></div>
<div class="confirm" id="confirm"><div class="in" id="confirmBody"></div></div>
<div class="toast" id="toast"></div>
<div class="actionbar" id="actionbar">
  <div class="in">
    <button id="cancelBtn">取消</button>
    <button id="mainBtn">记一笔</button>
  </div>
</div>

<div class="mask" id="mask">
  <div class="sheet" role="dialog" aria-label="设置">
    <h3>设置 <button id="closeSheet">取消</button></h3>

    <p class="lbl">主要货币</p>
    <div class="seg" id="mainSeg"></div>

    <p class="lbl" id="budgetLbl">每月预算</p>
    <input class="field full big2 num" id="budgetInput" inputmode="decimal" placeholder="比如 800">

    <p class="lbl">其他币种和汇率</p>
    <div id="rateRows"></div>
    <select class="field" id="addCurSel" aria-label="添加币种"></select>
    <p class="small" id="rateMsg"></p>

    <p class="lbl">类别</p>
    <div class="catedit" id="catEdit"></div>
    <div class="addcat">
      <input class="field" id="newCat" placeholder="新类别" maxlength="6">
      <button id="addCatBtn">添加</button>
    </div>
    <p class="small" id="catMsg"></p>

    <p class="lbl">API key</p>
    <input class="field full" id="keyInput" type="password" placeholder="sk-ant-…（只存在本机）" autocomplete="off" autocapitalize="off" spellcheck="false">

    <button class="primary" id="saveSettings">保存</button>

    <h4>备份</h4>
    <p class="small" id="backupInfo"></p>
    <div class="two">
      <button class="ghost" id="exportBtn">导出备份</button>
      <button class="ghost" id="importFileBtn">从文件导入</button>
    </div>
    <input type="file" id="importFile" accept=".json,application/json,text/plain" style="display:none">
    <textarea class="field" id="importText" placeholder="或粘贴备份文字"></textarea>
    <button class="ghost" id="importTextBtn">导入粘贴的文字</button>
    <p class="small" id="backupMsg" style="margin-top:8px"></p>

    <button class="ghost" id="copyCsv">复制本月明细</button>
    <div class="hint" id="sheetHint"></div>
  </div>
</div>

<script>
/* ================= 基本设定 ================= */
const CUR = {
  USD:{n:'美元',s:'$'},   CNY:{n:'人民币',s:'¥'}, EUR:{n:'欧元',s:'€'},  GBP:{n:'英镑',s:'£'},
  JPY:{n:'日元',s:'JP¥'}, HKD:{n:'港币',s:'HK$'}, CAD:{n:'加元',s:'C$'}, KRW:{n:'韩元',s:'₩'}
};
const LEGACY_SYM = {'$':'USD','¥':'CNY','€':'EUR'};
const DEFAULT_UNITS = { USD: 1, CNY: 6.67 };
const PALETTE = ['#e07a5f','#8e7dbe','#3d8bb5','#d4a017','#2f9e7a','#9a958c','#d16ba5','#4fa3a5','#c08552','#6b8f3a'];
const DEFAULT_CATS = [
  {name:'餐饮',color:'#e07a5f'},{name:'购物',color:'#8e7dbe'},{name:'交通',color:'#3d8bb5'},
  {name:'娱乐',color:'#d4a017'},{name:'日用',color:'#2f9e7a'},{name:'其他',color:'#9a958c'}
];
const MAX_CATS = 10;
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
const APP_VERSION = '11';
const AI_MODEL = 'claude-haiku-5-5';
const BACKUP_EVERY_DAYS = 7;

let settings = defaultSettings();
let entries = [];
let viewKey = monthKey(new Date());
let selCat = settings.cats[0].name;
let selCur = 'USD';
let lastInput = 'manual';      // 最后在哪个框输入：'ai' 或 'manual'
let pending = null;            // 等待确认的账：{ from: 'ai'|'manual', list: [...] }
let busy = false;

function defaultSettings(){
  return { budget: 0, main: 'USD', curs: ['USD','CNY'], units: {...DEFAULT_UNITS},
           cats: DEFAULT_CATS.map(c => ({...c})), lastT: 0, firstT: 0, lastBackup: 0, legacyCur: 'USD', learn: {} };
}

const $ = id => document.getElementById(id);
function pad(n){ return String(n).padStart(2,'0'); }
function monthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return dateStr(new Date()); }
function dim(key){ const [y,m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function shiftMonth(key, d){ const [y,m] = key.split('-').map(Number); return monthKey(new Date(y, m-1+d, 1)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function md(ds){ const d = new Date(ds + 'T00:00:00'); return (d.getMonth()+1) + '月' + d.getDate() + '日'; }
function parseAmt(raw){ raw = String(raw).trim().replace(/,/g, ''); if (!raw) return NaN; return Math.round(parseFloat(raw) * 100) / 100; }
function r2(x){ return Math.round(x * 100) / 100; }
function sym(code){ return (CUR[code] || {s: code + ' '}).s; }
function cname(code){ return (CUR[code] || {n: code}).n; }
function colorOf(name){ const c = settings.cats.find(x => x.name === name); return c ? c.color : '#a8a49c'; }
function fmt(n, code){
  code = code || settings.main;
  const v = Math.abs(n);
  const s = v.toLocaleString('en-US', { minimumFractionDigits: Math.round(v*100) % 100 ? 2 : 0, maximumFractionDigits: 2 });
  return (n < 0 ? '-' : '') + sym(code) + s;
}
function sig(x){ return String(Number(x.toPrecision(4))); }
function daysSince(t){ const a = new Date(t); a.setHours(0,0,0,0); const b = new Date(); b.setHours(0,0,0,0); return Math.round((b - a) / 86400000); }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function validDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00')); }

/* ================= 存储（本机） ================= */
const mem = {};
const LS = {
  get(k){ try { const v = localStorage.getItem(k); return v != null ? JSON.parse(v) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
  set(k, v){ mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  keys(){ try { return Object.keys(localStorage); } catch(e){ return Object.keys(mem); } }
};
function loadMonth(k){ const b = LS.get('jz:m-' + k); return (b && Array.isArray(b.entries)) ? b.entries : []; }
function saveMonth(k, list){ if (!LS.set('jz:m-' + k, { entries: list })) toast('没存进去，手机存储可能满了', true); }
function saveSettings(){ LS.set('jz:settings', settings); }
function getKey(){ try { return localStorage.getItem('jz:apikey') || ''; } catch(e){ return mem['jz:apikey'] || ''; } }
function setKey(v){ mem['jz:apikey'] = v; try { v ? localStorage.setItem('jz:apikey', v) : localStorage.removeItem('jz:apikey'); } catch(e){} }

function normalizeSettings(b){
  if (!b || typeof b !== 'object') return defaultSettings();
  const cats = Array.isArray(b.cats)
    ? b.cats.filter(c => c && typeof c.name === 'string' && c.name.trim()).slice(0, MAX_CATS)
        .map((c, i) => ({ name: c.name.trim().slice(0, 6), color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : PALETTE[i % PALETTE.length] }))
    : [];
  const legacyCur = CUR[b.legacyCur] ? b.legacyCur : (LEGACY_SYM[b.currency] || 'USD');
  const units = {...DEFAULT_UNITS};
  if (b.units && typeof b.units === 'object'){
    Object.keys(b.units).forEach(c => { const v = Number(b.units[c]); if (CUR[c] && v > 0) units[c] = v; });
  }
  const main = CUR[b.main] ? b.main : legacyCur;
  let curs = Array.isArray(b.curs) ? b.curs.filter(c => CUR[c] && units[c] > 0) : [main, 'CNY', 'USD'];
  curs = Array.from(new Set([main].concat(curs)));
  return {
    budget: Number(b.budget) > 0 ? Number(b.budget) : 0,
    main, curs, units,
    cats: cats.length ? cats : DEFAULT_CATS.map(c => ({...c})),
    lastT: Number(b.lastT) || 0, firstT: Number(b.firstT) || 0, lastBackup: Number(b.lastBackup) || 0,
    learn: cleanLearn(b.learn),
    legacyCur
  };
}

/* ================= 记住你的分类习惯 ================= */
// learn 的格式：{ "西太后": { cat: "购物", t: 时间 } }，最多记 200 条
const LEARN_MAX = 200;
function normKey(s){ return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ').slice(0, 30); }
function cleanLearn(l){
  const out = {};
  if (l && typeof l === 'object') Object.keys(l).forEach(k => {
    const v = l[k], key = normKey(k);
    if (key.length >= 2 && v && typeof v.cat === 'string') out[key] = { cat: v.cat.slice(0, 6), t: Number(v.t) || 0 };
  });
  return out;
}
function learnSet(note, cat){
  const key = normKey(note);
  if (key.length < 2) return;
  settings.learn[key] = { cat, t: Date.now() };
  const keys = Object.keys(settings.learn);
  if (keys.length > LEARN_MAX){
    keys.sort((a, b) => settings.learn[a].t - settings.learn[b].t).slice(0, keys.length - LEARN_MAX).forEach(k => delete settings.learn[k]);
  }
}
// 按备注找你以前定过的类别：完全一样优先，其次是备注里包含学过的词（取最长的那个）
function learnedCat(note){
  const n = normKey(note);
  if (!n) return null;
  const L = settings.learn;
  const ok = c => settings.cats.some(x => x.name === c);
  if (L[n] && ok(L[n].cat)) return L[n].cat;
  let best = null;
  Object.keys(L).forEach(k => { if (k.length >= 2 && n.includes(k) && ok(L[k].cat) && (!best || k.length > best.length)) best = k; });
  return best ? L[best].cat : null;
}
function learnHints(){
  return Object.keys(settings.learn)
    .filter(k => settings.cats.some(c => c.name === settings.learn[k].cat))
    .sort((a, b) => settings.learn[b].t - settings.learn[a].t).slice(0, 40)
    .map(k => k + ' → ' + settings.learn[k].cat);
}

/* ================= 换算 ================= */
function convert(x, from, to, units){
  units = units || settings.units;
  if (from === to) return x;
  const a = units[from], b = units[to];
  if (!(a > 0 && b > 0)) return null;
  return x * b / a;
}
function curOf(e){ return e.cur || settings.legacyCur || settings.main; }
function mainVal(e){
  const main = settings.main, cur = curOf(e);
  if (cur === main) return e.amt;
  if (e.baseCur === main && isFinite(e.base)) return e.base;
  if (e.baseCur && isFinite(e.base)){ const v = convert(e.base, e.baseCur, main); if (v != null) return v; }
  const v = convert(e.amt, cur, main);
  return v != null ? v : e.amt;
}
function sum(list){ return list.reduce((s, e) => s + mainVal(e), 0); }
function isCurrentMonth(){ return viewKey === monthKey(new Date()); }

function makeEntry(amt, cur, cat, note, date){
  const inMain = convert(amt, cur, settings.main);
  if (inMain == null) return null;
  return { id: newId(), amt, cur, base: r2(inMain), baseCur: settings.main, cat, note: note || '', date, t: Date.now() };
}
function commit(list){
  const byMonth = {};
  list.forEach(e => (byMonth[e.date.slice(0,7)] = byMonth[e.date.slice(0,7)] || []).push(e));
  Object.keys(byMonth).forEach(k => {
    if (k === viewKey){ entries = entries.concat(byMonth[k]); saveMonth(k, entries); }
    else saveMonth(k, loadMonth(k).concat(byMonth[k]));
  });
  const now = Date.now();
  settings.lastT = now;
  if (!settings.firstT) settings.firstT = now;
  saveSettings();
}
function openMonth(key){ viewKey = key; entries = loadMonth(key).map(e => ({...e})); render(); }

/* ================= 渲染 ================= */
function render(){
  const [y, m] = viewKey.split('-').map(Number);
  $('monthLabel').textContent = y + '年' + m + '月';
  $('next').disabled = viewKey >= monthKey(new Date());
  if (!settings.cats.some(c => c.name === selCat)) selCat = settings.cats[0].name;
  if (!settings.curs.includes(selCur)) selCur = settings.main;
  const d = $('date');
  d.min = viewKey + '-01';
  d.max = viewKey + '-' + pad(dim(viewKey));
  if (!d.value || d.value.slice(0,7) !== viewKey) d.value = isCurrentMonth() ? todayStr() : viewKey + '-01';

  renderBanners(); renderHero(); renderAIBox(); renderCurPick(); renderPreview();
  renderChips(); renderWarns(); renderBreakdown(); renderList(); renderBar();
}

function renderBanners(){
  const r = $('remindBar');
  if (settings.lastT && isCurrentMonth() && daysSince(settings.lastT) >= 2){
    r.textContent = daysSince(settings.lastT) + ' 天没记账了，可以改日期补上。';
    r.classList.add('show');
  } else r.classList.remove('show');
  const b = $('backupBar');
  const since = settings.lastBackup || settings.firstT;
  if (settings.firstT && since && daysSince(since) >= BACKUP_EVERY_DAYS){
    b.innerHTML = (settings.lastBackup ? daysSince(settings.lastBackup) + ' 天没备份了。' : '还没备份过。') + ' <button id="goBackup">去导出</button>';
    b.classList.add('show');
    $('goBackup').onclick = () => { openSheet(); setTimeout(() => $('exportBtn').scrollIntoView({block:'center'}), 50); };
  } else b.classList.remove('show');
}

function renderHero(){
  const el = $('hero');
  const spent = sum(entries);
  const budget = settings.budget;
  const cur = isCurrentMonth();
  if (!budget){
    el.innerHTML =
      '<div class="label">' + (cur ? '本月已花' : '这个月花了') + '</div>' +
      '<div class="big num">' + fmt(spent) + '</div>' +
      '<button class="linkbtn" id="setBudget">设预算 →</button>';
    $('setBudget').onclick = openSheet;
    return;
  }
  const remaining = budget - spent;
  const ratio = Math.min(spent / budget, 1);
  const color = spent >= budget ? 'var(--danger)' : (ratio >= .8 ? 'var(--amber)' : 'var(--accent)');
  let stats = '';
  if (cur){
    const today = todayStr();
    const todaySpent = sum(entries.filter(e => e.date === today));
    const daysLeft = dim(viewKey) - new Date().getDate() + 1;
    // 今天的额度 = 今天之前剩下的预算 ÷ 本月剩下的天数（含今天）；今天还能花 = 额度 − 今天已花
    const allowance = Math.max(0, budget - (spent - todaySpent)) / daysLeft;
    const canSpend = Math.floor((allowance - todaySpent) * 100) / 100;
    stats =
      '<div class="stats">' +
        '<div class="stat"><div class="label">今天还能花</div><div class="v num' + (canSpend < 0 ? ' neg' : '') + '">' + fmt(canSpend) + '</div></div>' +
        '<div class="stat"><div class="label">今天已花</div><div class="v num">' + fmt(todaySpent) + '</div></div>' +
      '</div>';
  }
  el.innerHTML =
    '<div class="label">' + (cur ? '本月还剩' : '这个月剩下') + '</div>' +
    '<div class="big num' + (remaining < 0 ? ' over' : '') + '">' + fmt(remaining) + '</div>' +
    '<div class="spent num"><b>已花 ' + fmt(spent) + '</b><span>/ ' + fmt(budget) + '</span></div>' +
    '<div class="bar"><i style="width:' + (ratio * 100).toFixed(1) + '%;background:' + color + '"></i></div>' +
    stats;
}

function renderAIBox(){
  const t = $('aiText');
  const has = !!getKey();
  t.disabled = !has;
  t.placeholder = has ? '说一句，AI 帮你记' : '在设置里填 API key 后，可以说一句让 AI 记';
}

function renderCurPick(){
  $('curSym').textContent = sym(selCur);
  const el = $('curPick');
  if (settings.curs.length < 2){ el.innerHTML = ''; return; }
  const order = [settings.main].concat(settings.curs.filter(c => c !== settings.main));
  el.innerHTML = order.map(c =>
    '<button data-c="' + c + '" class="' + (c === selCur ? 'on' + (c !== settings.main ? ' foreign' : '') : '') + '" aria-label="' + cname(c) + '">' + esc(sym(c)) + '</button>'
  ).join('');
}

// 记下 extra（主要货币金额）之后，本月还剩多少的一句话
function afterText(extra){
  if (!settings.budget) return '';
  const after = settings.budget - sum(entries) - extra;
  if (after < 0) return '还剩 <span class="over">' + fmt(after) + '</span>，<span class="over">超预算了</span>';
  let t = '还剩 <b>' + fmt(after) + '</b>';
  if (isCurrentMonth()){
    const daysAfter = dim(viewKey) - new Date().getDate();
    if (daysAfter > 0) t += '，每天平均 <b>' + fmt(Math.floor(after / daysAfter * 100) / 100) + '</b>';
  }
  return t;
}

function renderPreview(){
  const el = $('preview');
  const amt = parseAmt($('amount').value);
  if (!isFinite(amt) || amt <= 0){ el.innerHTML = ''; return; }
  const inMain = convert(amt, selCur, settings.main);
  if (inMain == null){ el.innerHTML = '<span class="over">缺少' + cname(selCur) + '的汇率</span>'; return; }
  const parts = [];
  if (selCur !== settings.main) parts.push('≈ <b>' + fmt(inMain) + '</b>');
  const a = afterText(inMain); if (a) parts.push(a);
  el.innerHTML = parts.join('。');
}

let chipEdit = false;   // 类别标签是不是在编辑模式
let chipDraft = [];     // 编辑时先改这份草稿，点「完成」才保存
function renderChips(){
  if (!chipEdit){
    $('chips').innerHTML = settings.cats.map(c =>
      '<button class="chip' + (c.name === selCat ? ' on' : '') + '" data-c="' + esc(c.name) + '"><i style="background:' + c.color + '"></i>' + esc(c.name) + '</button>'
    ).join('') + '<button class="chip edit" id="editChips">编辑</button>';
    return;
  }
  $('chips').innerHTML = chipDraft.map(c =>
    '<button class="chip" data-del="' + esc(c.name) + '" aria-label="删除 ' + esc(c.name) + '"><i style="background:' + c.color + '"></i>' + esc(c.name) + '<span class="x">×</span></button>'
  ).join('') +
  (chipDraft.length < MAX_CATS ? '<button class="chip add" id="addChip" aria-label="添加类别">＋</button>' : '') +
  '<button class="chip edit" id="cancelChips">取消</button>' +
  '<button class="chip done" id="doneChips">完成</button>';
}
// 在标签最后直接添加新类别
function startAddChip(){
  const btn = $('addChip'); if (!btn) return;
  const inp = document.createElement('input');
  inp.className = 'chipinput'; inp.maxLength = 6; inp.placeholder = '新类别';
  btn.replaceWith(inp); inp.focus();
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const name = inp.value.trim();
    if (ok && name){
      if (chipDraft.some(c => c.name === name)){ toast('「' + name + '」已经有了'); }
      else if (chipDraft.length >= MAX_CATS){ toast('最多 10 个类别', true); }
      else {
        const used = new Set(chipDraft.map(c => c.color));
        chipDraft.push({ name, color: PALETTE.find(p => !used.has(p)) || PALETTE[chipDraft.length % PALETTE.length] });
      }
    }
    renderChips(); renderBar();
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); finish(true); } else if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}

function renderWarns(){
  const foreign = selCur !== settings.main;
  $('curwarn').classList.toggle('show', foreign);
  if (foreign){ $('curwarnText').textContent = '正在用' + cname(selCur) + '记'; $('backMain').textContent = '改回' + cname(settings.main); }
  const d = $('date');
  const notToday = d.value && d.value !== todayStr();
  d.classList.toggle('notToday', !!notToday);
  $('datewarn').classList.toggle('show', !!notToday);
  if (notToday) $('datewarnText').textContent = '正在记 ' + md(d.value);
  $('backToday').style.display = isCurrentMonth() ? '' : 'none';
}

function renderBreakdown(){
  const card = $('breakPart');
  if (!entries.length){ card.style.display = 'none'; return; }
  card.style.display = '';
  const total = sum(entries);
  const by = {};
  entries.forEach(e => by[e.cat] = (by[e.cat] || 0) + mainVal(e));
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const max = rows[0][1] || 1;
  $('breakdown').innerHTML = rows.map(([c, v]) =>
    '<div class="cat"><span class="n">' + esc(c) + '</span>' +
    '<span class="track"><i style="width:' + (v / max * 100).toFixed(1) + '%;background:' + colorOf(c) + '"></i></span>' +
    '<span class="a num">' + fmt(v) + '<em>' + (total ? Math.round(v / total * 100) : 0) + '%</em></span></div>'
  ).join('');
}

function itemHtml(e, btn, showDate){
  const cur = curOf(e);
  const orig = cur !== settings.main ? '<small>(' + esc(fmt(e.amt, cur)) + ')</small>' : '';
  return '<div class="item"><span class="dot" style="background:' + colorOf(e.cat) + '"></span>' +
    (showDate ? '<span class="d">' + (e.date === todayStr() ? '今天' : md(e.date)) + '</span>' : '') +
    '<span class="c">' + esc(e.cat) + '</span>' +
    '<span class="note">' + esc(e.note || '') + '</span>' +
    '<span class="more">展开</span>' +
    '<span class="m num">' + fmt(mainVal(e)) + orig + '</span>' + btn + '</div>';
}

function renderList(){
  const el = $('list');
  if (!entries.length){ el.innerHTML = '<div class="empty">这个月还没有记录</div>'; return; }
  const days = {};
  entries.forEach(e => (days[e.date] = days[e.date] || []).push(e));
  el.innerHTML = Object.keys(days).sort().reverse().map(d => {
    const list = days[d].slice().sort((a, b) => b.t - a.t);
    const label = md(d) + ' ' + WEEK[new Date(d + 'T00:00:00').getDay()] + (d === todayStr() ? ' · 今天' : '');
    return '<div class="day"><span>' + label + '</span><span class="num">' + fmt(sum(list)) + '</span></div>' +
      list.map(e => itemHtml(e, '<button class="del" data-id="' + esc(e.id) + '" aria-label="删除">×</button>')).join('');
  }).join('');
  markTruncated();
}
// 备注被截断（显示成 …）的那几条，后面加「展开」
function markTruncated(){
  requestAnimationFrame(() => {
    document.querySelectorAll('#list .item').forEach(it => {
      const n = it.querySelector('.note');
      if (!n || it.classList.contains('open')) return;
      it.classList.toggle('trunc', n.scrollWidth > n.clientWidth + 1);
    });
  });
}
window.addEventListener('resize', markTruncated);

/* ================= 底部按钮：第一下处理，第二下确认 ================= */
function mode(){
  const aiOk = !!getKey() && $('aiText').value.trim();
  const amtOk = parseAmt($('amount').value) > 0;
  if (lastInput === 'ai' && aiOk) return 'ai';
  if (amtOk) return 'manual';
  if (aiOk) return 'ai';
  return 'manual';
}
function renderBar(){
  const btn = $('mainBtn');
  const m = mode();
  $('aiText').classList.toggle('active', !pending && m === 'ai' && !!$('aiText').value.trim());
  $('amtRow').classList.toggle('active', !pending && m === 'manual' && parseAmt($('amount').value) > 0);
  if (busy){ btn.textContent = 'AI 在想…'; btn.disabled = true; return; }
  btn.disabled = false;
  if (pending) btn.textContent = pending.list.length > 1 ? '确认（' + pending.list.length + ' 笔）' : '确认';
  else btn.textContent = m === 'ai' ? '让 AI 拆账' : '记一笔';
}

let toastTimer;
function toast(t, err){
  const el = $('toast'); el.textContent = t; el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = 'toast' + (err ? ' err' : ''); }, 2200);
}

function showConfirm(from, list){
  list.forEach(e => { e._orig = e.cat; });   // 记下原来的类别，确认时看你有没有改
  pending = { from, list };
  document.body.classList.add('confirming');
  renderConfirm();
  renderBar();
}
function closeConfirm(){
  pending = null;
  document.body.classList.remove('confirming');
  renderBar();
}
function catSelect(e, i){
  return '<label class="catsel"><i style="background:' + colorOf(e.cat) + '"></i><span>' + esc(e.cat) + '</span><span class="caret">▾</span>' +
    '<select data-si="' + i + '" aria-label="改类别">' + settings.cats.map(c =>
      '<option value="' + esc(c.name) + '"' + (c.name === e.cat ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') +
    (settings.cats.some(c => c.name === e.cat) ? '' : '<option selected>' + esc(e.cat) + '</option>') +
    '</select></label>';
}
function renderConfirm(){
  const box = $('confirmBody');
  const list = pending.list;
  const total = list.reduce((s, e) => s + e.base, 0);
  const inView = list.filter(e => e.date.slice(0,7) === viewKey).reduce((s, e) => s + e.base, 0);
  const a = afterText(inView);
  const after = a ? '<div class="after">' + a + '</div>' : '';
  if (pending.from === 'manual'){
    // 手动记的：一个大数字
    const e = list[0], cur = curOf(e);
    box.className = 'in';
    box.innerHTML = '<div class="one">' +
      '<div class="a num">' + fmt(e.amt, cur) + '</div>' +
      (cur !== settings.main ? '<div class="eq num">≈ ' + fmt(e.base) + '</div>' : '') +
      '<div class="row">' + catSelect(e, 0) + (e.note ? '<span class="nt">' + esc(e.note) + '</span>' : '') + '</div>' +
      '</div>' + after;
    return;
  }
  // AI 拆的：永远是列表，弹窗高度固定，笔数多了在里面滑
  box.className = 'in list';
  box.innerHTML = '<div class="head num">' + list.length + ' 笔，合计 ' + fmt(total) + '</div>' +
    '<div class="scroll">' + list.map((e, i) => {
      const cur = curOf(e);

function buildPrompt(){
  const now = new Date();
  const curList = settings.curs.map(c => c + '（' + cname(c) + '）').join('、');
  const catList = settings.cats.map(c => c.name).join('、');
  const fallback = settings.cats.some(c => c.name === '其他') ? '其他' : settings.cats[settings.cats.length - 1].name;
  return [
    '你是记账助手。把用户说的话拆成一笔或多笔「支出」。',
    '只输出一个 JSON 数组，不要任何解释或其他文字。每一项的格式：',
    '{"amt": 数字, "cur": "币种代码", "cat": "类别", "note": "很短的备注", "date": "YYYY-MM-DD"}',
    '',
    '规则：',
    '- 今天是 ' + dateStr(now) + '（' + WEEK[now.getDay()] + '）。没说日期就用今天；「昨天」「周一」等换算成具体日期，不能晚于今天。',
    '- 币种只能从这些里选：' + curList + '。',
    '- 没说币种时，用 ' + settings.main + '（' + cname(settings.main) + '）。「块」「元」本身不代表人民币。',
    '- 明确说了人民币、RMB、或者提到微信、支付宝付款时，用 CNY（如果上面的列表里有）。「刀」「美元」「美金」用 USD。',
    '- 类别只能从这些里选：' + catList + '。',
    '- 分类前先想一想这个名字是什么：是品牌、店名还是商品？比如奢侈品牌、服装店、商场归购物；餐厅、咖啡、奶茶归餐饮或对应类别；Uber、地铁、加油归交通。不认识的名字不要因为听起来像食物就归到餐饮。',
    '- 实在判断不了，用「' + fallback + '」，不要乱猜。',
    '- note 写这笔钱花在哪：完整保留用户原话里的店名、品牌或商品名，一个字都不要缩写、概括或翻译（最多 60 个字）。比如用户说「在 Abercrombie & Fitch 买了一件卫衣」，note 就是「Abercrombie & Fitch 卫衣」。'
  ].concat(learnHints().length ? ['', '这个用户以前定过的分类（优先照这个来，note 里出现这些词就用对应类别）：'].concat(learnHints().map(h => '- ' + h)) : []).concat([
    '- 只记支出。收入、转账收款、退款都不要记。',
    '- 如果没有任何支出，输出 []。'
  ]).join('\n');
}
async function runAI(){
  const text = $('aiText').value.trim();
  if (!text) return toast('先说一句', true);
  if (!navigator.onLine) return toast('没网，AI 用不了，先手动记', true);
  const key = getKey(); if (!key) return toast('先在设置里填 API key', true);
  busy = true; renderBar();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: AI_MODEL, max_tokens: 2000, system: buildPrompt(), messages: [{ role: 'user', content: text }] })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok){
      const msg = data && data.error && data.error.message || ('HTTP ' + res.status);
      if (res.status === 401) throw new Error('API key 不对');
      if (res.status === 429) throw new Error('请求太频繁，等一会儿');
      if (res.status === 400 && /credit|balance/i.test(msg)) throw new Error('API 余额不够了');
      throw new Error('AI 出错：' + msg);
    }
    const out = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    const s = out.indexOf('['), t = out.lastIndexOf(']');
    if (s < 0 || t < s) throw new Error('AI 没看懂，换个说法试试');
    const list = cleanProposals(JSON.parse(out.slice(s, t + 1)));
    busy = false;
    if (!list.length){ renderBar(); toast('没听出有花钱的地方', true); return; }
    showConfirm('ai', list);
  } catch(err){
    busy = false; renderBar();
    toast(err && err.message && !/Failed to fetch|Load failed|NetworkError/i.test(err.message) ? err.message : '连不上 AI，检查网络', true);
  }
}
function cleanProposals(arr){
  if (!Array.isArray(arr)) return [];
  const today = todayStr();
  const fallback = settings.cats.some(c => c.name === '其他') ? '其他' : settings.cats[settings.cats.length - 1].name;
  return arr.slice(0, 20).map(x => {
    if (!x || typeof x !== 'object') return null;
    const amt = r2(Number(x.amt));
    if (!(amt > 0 && amt < 1e9)) return null;
    const cur = settings.curs.includes(x.cur) ? x.cur : settings.main;
    const note = String(x.note || '').slice(0, 60);
    const cat = learnedCat(note) || (settings.cats.some(c => c.name === x.cat) ? x.cat : fallback);
    let date = typeof x.date === 'string' && validDate(x.date) ? x.date : today;
    if (date > today) date = today;
    return makeEntry(amt, cur, cat, note, date);
  }).filter(Boolean);
}

function allMonths(){

$('exportBtn').onclick = async () => {
  const text = backupText();
  const name = '记账备份-' + todayStr() + '.json';
  const done = () => { settings.lastBackup = Date.now(); saveSettings(); renderBackupInfo(); renderBanners(); };
  try {
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: name });
      done(); msg('backupMsg', '已导出，建议存到 iCloud 云盘', 'ok');
      return;
    }
  } catch(e){
    if (e && e.name === 'AbortError'){ msg('backupMsg', '取消了'); return; }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    done(); msg('backupMsg', '已下载 ' + name, 'ok');
  } catch(e){ msg('backupMsg', '导出失败：' + (e && e.message || e), 'err'); }
};

  e.target.value = '';

  const t = $('importText').value.trim();

function importData(text){
  let data;
  try { data = JSON.parse(text); } catch(e){ return msg('backupMsg', '内容不完整或不对', 'err'); }
  if (!data || data.app !== 'jizhang' || typeof data.months !== 'object') return msg('backupMsg', '这不是记账的备份', 'err');
  if (!settings.budget && data.settings){
    const keep = { lastT: settings.lastT, firstT: settings.firstT, lastBackup: settings.lastBackup };
    settings = normalizeSettings(data.settings);
    settings.lastT = Math.max(keep.lastT, settings.lastT);
    settings.firstT = keep.firstT || settings.firstT || Date.now();
    settings.lastBackup = keep.lastBackup;
  }
  let added = 0, skipped = 0;
  const legacy = data.settings ? normalizeSettings(data.settings).legacyCur : settings.legacyCur;
  Object.keys(data.months).forEach(k => {
    if (!/^\d{4}-\d{2}$/.test(k) || !Array.isArray(data.months[k])) return;
    const cur = loadMonth(k);
    const ids = new Set(cur.map(e => e.id));
    data.months[k].forEach(e => {
      if (!e || !(Number(e.amt) > 0) || !validDate(e.date)) return;
      if (e.id && ids.has(e.id)){ skipped++; return; }
      const item = {...e, amt: Number(e.amt), id: e.id || newId(), t: Number(e.t) || Date.now()};
      if (!item.cur) item.cur = legacy;
      cur.push(item); ids.add(item.id); added++;
    });
    saveMonth(k, cur);
  });
  if (!settings.firstT && added) settings.firstT = Date.now();
  saveSettings();
  draft = { main: settings.main, curs: settings.curs.slice(), units: {...settings.units}, cats: settings.cats.map(c => ({...c})) };
  $('budgetInput').value = settings.budget || '';
  renderMainSeg(); renderRates(); renderCatEdit();
  openMonth(viewKey);
  msg('backupMsg', '导入了 ' + added + ' 笔' + (skipped ? '，跳过 ' + skipped + ' 笔重复' : ''), 'ok');
  $('importText').value = '';
}

  );

function init(){
  settings = normalizeSettings(LS.get('jz:settings'));
  selCur = settings.main;
  openMonth(viewKey);
  placeBar();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
  if ('serviceWorker' in navigator && location.protocol !== 'file:'){
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
  }
  checkUpdate();
  const standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!standalone && /iPhone|iPad/.test(navigator.userAgent)){
    $('noteBar').textContent = '请从主屏幕图标打开，Safari 里的账和主屏幕上的不互通。';
    $('noteBar').classList.add('show');
  }
}
// 检查有没有新版本：version.txt 里的数字和这个页面的 APP_VERSION 不一样，就提示更新
async function checkUpdate(){
  if (location.protocol === 'file:' || !navigator.onLine) return;
  try {
    const res = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const v = (await res.text()).trim();
    if (v && v !== APP_VERSION) $('updateBar').classList.add('show');
  } catch(e){}
}
$('updateBtn').onclick = async () => {
  $('updateBtn').textContent = '更新中…';
  try {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
  } catch(e){}
  location.reload();
};
document.addEventListener('visibilitychange', () => { if (!document.hidden){ if (!pending) render(); checkUpdate(); } });
init();
</script>
